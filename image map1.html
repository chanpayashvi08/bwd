<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image map rectangle</title>
</head>
<body>
  <h1>rectangle image map</h1>
  <img src="imgmap-1.png"  usemap="#map1" width="500px" height="300px">
  <map name="map1">
    <area shape="rect" coords="50,50,200,150" 
    href="imgmap-1.png" target="blank">
  </map> 
</body>
</html>
