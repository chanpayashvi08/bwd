<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>square image map</title>
</head>
<body>
    <h1>square image map</h1>
    <img src="imgmap4square.png"  usemap="#map1" width="500px" height="300px">
    <map name="map1">
      <area shape="circle" coords="50,50,200,150" 
      href="imgmap4square.png" target="blank">
    </map> 
</body>
</html>
