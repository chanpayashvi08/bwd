<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>
<body>
    <script>
        let num = prompt("Enter a number:");

        if (num % 2 == 0) {
            alert("The number is Even");
        } else {
            alert("The number is Odd");
        }
    </script>
</body>
</html>
