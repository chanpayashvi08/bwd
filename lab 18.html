
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        /* HORIZONTAL NAVBAR */
        .navbar {
            background: #10233f;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #20c7b7;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            padding: 10px;
        }

        .nav-links a:hover {
            color: #20c7b7;
        }

        /* HIDE CHECKBOX */
        #menu-toggle {
            display: none;
        }

        /* HAMBURGER ICON */
        .menu-icon {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* PAGE LAYOUT */
        .layout {
            display: flex;
            min-height: 90vh;
        }

        /* VERTICAL SIDEBAR */
        .sidebar {
            width: 220px;
            background: #1e293b;
            padding: 20px;
        }

        .sidebar h3 {
            color: #20c7b7;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background: #334155;
        }

        /* MAIN CONTENT */
        .content {
            flex: 1;
            padding: 40px;
        }

        .content h1 {
            margin-bottom: 15px;
            color: #10233f;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                padding: 15px 20px;
            }

            .menu-icon {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                gap: 0;
                padding-top: 15px;
            }

            /* OPEN MENU WITH CSS */
            #menu-toggle:checked ~ .nav-links {
                display: flex;
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                display: block;
                padding: 12px 0;
            }

            /* STACK SIDEBAR AND CONTENT */
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .content {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- HORIZONTAL NAVBAR -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            ☰
        </label>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- VERTICAL SIDEBAR -->
    <div class="layout">
        <aside class="sidebar">
            <h3>Sidebar Menu</h3>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="content" id="home">
            <h1>Welcome to MyWebsite</h1>
            <p>
                This webpage contains a horizontal navbar,
                vertical sidebar, and responsive hamburger menu.
            </p>
        </main>
    </div>

</body>
</html>
