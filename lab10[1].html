<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-indax example</title>
    <style>
        .container{
            position:relative;
            width:400px;
            height:400px;
            border:3px red;
            margin:50px auto;
        }
        .box{
            width:120px;
            height:120px;
            color:white;
            font-weight:bold;
            display:flex;
            align-items: center;
            justify-content:center;
            position:absolute;
        }
        .box-p{
            background-color:blueviolet;
            top:50px;
            left:30px;
            z-index:3;
         }
         .box-green{
            background-color:chartreuse;
            top:70px;
            left:57px;
            z-index:2;
         }
         .box-black{
            background-color:aquamarine;
            top:66px;
            left:22px;
            z-index:1;
         }
    </style>
</head>
<body>
    <h2 style="text-align: center;">z-index stacking example</h2>
    <div class="cotainer">
            <div class="box box-p">p(z-index:3)</div>
            <div class="box box-green">green(z-index:2)</div>
            <div class="box box-black">black(z-index:1)</div>
    </div>
</body>
</html>
