
<!DOCTYPE html>
<html>
<head>
    <title>Pyramid Pattern</title>
</head>
<body>
    <h2>Pyramid</h2>
    <pre id="output"></pre>

    <script>
        let rows = 5;
        let i = 1;
        let pyramid = "";

        while (i <= rows) {
            let j = 1;

            while (j <= rows - i) {
                pyramid += " ";
                j++;
            }

            let k = 1;

            while (k <= 2 * i - 1) {
                pyramid += "*";
                k++;
            }

            pyramid += "\n";
            i++;
        }

        document.getElementById("output").textContent = pyramid;
    </script>
</body>
</html>
