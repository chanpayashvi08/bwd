<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shapes</title>
    <style>
        .square{
            height: 400px;
            width:400px;
            border:50px;
           background-color:red ; 
        }
        .rectangle{
            height:500px;
            width:300px;
            border:100px;
            background-color:blue;
        }
        .circle{
            height:500px;
            width:500px;
            border-radius: 360px;
            background-color:green;
        }
        .tringle{
            height:500px;
            width:400px;
            border:300px;
            background-color:chocolate;
        }
    </style> 
</head>
<body>
    
    <h1> different shapes</h1>
    <div class="square"></div><br><br>
    <div class="rectangle"></div><br><br>
    <div class="circle"></div><br><br>
    <div class="tringle"></div><br><br>
</body>
</html>
